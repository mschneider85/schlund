<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1530" />
  <meta name="description" content="Steuere ein schwarzes Loch durch die Stadt und verschlinge alles." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <title>Schlund</title>
  
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="labels"></div>

  <div id="hud" class="hidden">
    <div id="timer">2:00</div>
    <ol id="board"></ol>
    <div id="solo">
      <div id="soloval">0 %</div>
      <div id="solobar"><div id="solofill"></div>
        <i style="left:52.6%"></i><i style="left:78.9%"></i>
      </div>
      <div id="solostars"><span>★</span><span>★</span><span>★</span></div>
    </div>
    <div id="levelbox">
      <div id="levelnum">Lvl 1</div>
      <div id="levelbar"><div id="levelfill"></div></div>
    </div>
    <div id="hudbtns">
      <button id="btnpause" class="icon" aria-label="Pause">⏸</button>
      <button id="btnmute" class="icon" aria-label="Ton an/aus">🔊</button>
    </div>
    <div id="toast"></div>
    <div id="count"></div>
  </div>

  <div id="menu" class="screen">
    <div class="card">
      <h1>SCHLUND</h1>
      <input id="name" maxlength="14" placeholder="Dein Name" autocomplete="off" />
      <div id="modes">
        <button class="mode sel" data-mode="battle"><b>Battle</b><small>Wer gefressen wird, fliegt raus</small></button>
        <button class="mode" data-mode="solo"><b>Solo</b><small>Friss so viel Stadt wie möglich</small></button>
      </div>
      <button id="play" class="big" disabled>LÄDT…</button>
      <div id="loadbar"><div></div></div>
      <p class="hint">Ziehen / Maus halten oder WASD · 2 Minuten</p>
      <p id="best"></p>
      <button id="install" class="small hidden">📲 Als App installieren</button>
    </div>
  </div>

  <div id="over" class="screen hidden">
    <div class="card">
      <h2 id="overtitle">Zeit um!</h2>
      <ol id="results"></ol>
      <p id="overbest"></p>
      <button id="again" class="big">NOCHMAL</button>
      <button id="tomenu" class="small">Zum Menü</button>
    </div>
  </div>

  <div id="pause" class="screen hidden">
    <div class="card">
      <h2 id="pausetitle">Pause</h2>
      <button id="resume" class="big">WEITER</button>
      <button id="quit" class="small">Runde beenden</button>
    </div>
  </div>

  <div id="loading" class="screen hidden"><p></p></div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
